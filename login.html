    <script data-source="theme.js">
'use strict';
// Run in <head> before styles: restore the saved theme before the first paint.
// This stores only a display preference, never account information.
(() => {
  const key = 'hearnest.theme';
  let current = 'light';
  function savedTheme() {
    try { const stored = localStorage.getItem(key); if (stored === 'dark' || stored === 'light') return stored; } catch {}
    try {
      const cookie = document.cookie.split('; ').find(item => item.startsWith('hearnest_theme='));
      return cookie?.split('=')[1] === 'dark' ? 'dark' : 'light';
    } catch { return 'light'; }
  }
  function apply(theme, persist = false) {
    if (theme !== 'dark' && theme !== 'light') return;
    current = theme;
    document.documentElement.dataset.theme = theme;
    const checkbox = document.getElementById('dark-mode');
    if (checkbox) checkbox.checked = theme === 'dark';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      if (!meta.dataset.lightThemeColor) meta.dataset.lightThemeColor = meta.content;
      meta.content = theme === 'dark' ? '#242620' : meta.dataset.lightThemeColor;
    }
    if (persist) {
      try { localStorage.setItem(key, theme); } catch {}
      // Cookie fallback preserves the preference when localStorage is restricted.
      try { if (location.protocol === 'http:' || location.protocol === 'https:') document.cookie = `hearnest_theme=${theme}; Path=/; SameSite=Lax; Max-Age=31536000${location.protocol === 'https:' ? '; Secure' : ''}`; } catch {}
    }
  }
  apply(savedTheme());
  document.addEventListener('DOMContentLoaded', () => {
    apply(savedTheme());
    document.getElementById('dark-mode')?.addEventListener('change', event => apply(event.target.checked ? 'dark' : 'light', true));
  });
  // Keep other tabs and browser Back/Forward restorations in sync.
  window.addEventListener('storage', event => { if (event.key === key) apply(event.newValue === 'dark' ? 'dark' : 'light'); });
  window.addEventListener('pageshow', () => apply(savedTheme()));
  window.HearnestTheme = { set: theme => apply(theme, true), get: () => current };
})();

 .lesson-header p, .playback-status, .gain-help, .gain-scale, .gauge-value > span,

:root[data-theme="dark"] .separator::before,
:root[data-theme="dark"] .separator::after { background: var(--theme-link); }
:root[data-theme="dark"] :is(.bottom-nav, .lesson-nav, .lesson-header) { background: var(--theme-raised); }
:root[data-theme="dark"] :is(.bottom-nav a, .lesson-nav a) { color: var(--home-ink); }
:root[data-theme="dark"] :is(.bottom-nav, .lesson-nav) { box-shadow: 0 -12px 28px #0005; }

:root[data-theme="dark"] .profile-avatar svg { stroke: #d9ddcf; }

:root[data-theme="dark"] :is(.sound-card, .lesson-tip, .gain-card,
 .profile-card, .profile-confirmation) { background: var(--theme-card); }

:root[data-theme="dark"] :is(.detail-panel, .settings-panel) { background: var(--theme-raised); }
:root[data-theme="dark"] :is(.lesson-tip p, .detail-panel, .settings-panel) { color: var(--ink); }
:root[data-theme="dark"] :is(.field input, .field select, .profile-field input,
 .profile-field select, .password-form input) { background: var(--theme-raised); color: var(--ink); border-color: #7994d3; }
:root[data-theme="dark"] :is(.field input, .profile-field input, .password-form input)::placeholder { color: #b5bba9; }
:root[data-theme="dark"] .social-button { border-color: #829de4; }
:root[data-theme="dark"] .social-button:not(:disabled):hover { background: var(--theme-card); }
:root[data-theme="dark"] .auth-status { background: #4b302b; color: #ffd5cb; }
:root[data-theme="dark"] .auth-status.is-success { background: #254638; color: #c2f2d6; }
:root[data-theme="dark"] .confirmation-mark,

/* Preserve the supplied raster logo's colors inside a deliberate image tile. */

  <body>
    <main class="signup-screen" aria-labelledby="login-title">
      <a class="auth-back" href="signup.html">&#8592; Back to sign up</a>
      <h1 id="login-title">Welcome back!</h1>
      <p class="login-intro">Log in to your HEARNEST account.</p>
      <p class="auth-status" data-auth-status role="status" hidden></p>
      <form id="login-form" class="signup-form login-form" method="post" action="/api/auth/login">
        <div class="field"><label for="login-email">Email of Parent</label><input id="login-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Enter your email" maxlength="254" required /></div>
        <div class="field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" maxlength="128" required /></div>
        <button class="start-button signup-submit" type="submit">Log in</button>
      </form>
      <noscript><p>Enable JavaScript to log in securely.</p></noscript>
      <div class="separator"><span>Or</span></div>
      <div class="social-options" aria-label="Sign-in options">
          <button
            class="social-button" data-provider="apple"
            type="button"
          >
            <svg
              class="provider-icon apple-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M17.05 12.54c.03 3.24 2.84 4.32 2.87 4.33-.02.08-.45 1.54-1.48 3.05-.9 1.3-1.83 2.6-3.3 2.63-1.44.03-1.9-.85-3.55-.85-1.64 0-2.15.82-3.52.88-1.42.05-2.49-1.41-3.39-2.71-1.84-2.66-3.25-7.52-1.36-10.8a5.26 5.26 0 0 1 4.45-2.7c1.39-.03 2.71.94 3.56.94.84 0 2.43-1.17 4.09-1  .7.03 2.66.28 3.92 2.12-.1.06-2.34 1.36-2.29 4.11ZM14.34 4.55c.75-.91 1.26-2.18 1.12-3.45-1.08.04-2.39.72-3.17 1.63-.7.81-1.31 2.1-1.15 3.35 1.21.09 2.45-.62 3.2-1.53Z"
              />
            </svg>
            <span>Login with Apple</span>
          </button>
          <button
            class="social-button" data-provider="google"
            type="button"
          >
            <svg class="provider-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#4285f4"
                d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.36Z"
              />
              <path
                fill="#34a853"
                d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.05.97-3.38.97-2.6 0-4.81-1.76-5.6-4.12H3.06v2.59A10 10 0 0 0 12 22Z"
              />

              />
              <path
                fill="#ea4335"
                d="M12 5.95c1.47 0 2.79.51 3.83 1.51l2.88-2.88A9.63 9.63 0 0 0 12 2a10 10 0 0 0-8.94 5.48l3.34 2.59A5.99 5.99 0 0 1 12 5.95Z"
              />
            </svg>
            <span>Login with Google</span>
          </button>
        </div>
      <p class="login-prompt">New to HEARNEST? <a class="text-button" href="signup.html">Sign up</a></p>
      <p class="service-note">Apple and Google sign-in setup is pending.</p>
    </main>
      <!-- Internal script: auth.js -->
    <script data-source="auth.js">
'use strict';
// Account UI uses the same-origin backend. Passwords and session tokens are
// never stored in localStorage or browser-readable cookies.
(() => {
  const message = document.querySelector('[data-auth-status]');
  function show(text, success = false) {
    if (!message) return;
    message.textContent = text;
    message.hidden = false;
    message.classList.toggle('is-success', success);
  }
  async function session() {
    if (!['http:', 'https:'].includes(location.protocol)) throw Error('Start the backend and open http://localhost:3000 to use accounts.');
    const response = await fetch('/api/auth/session', { credentials: 'same-origin', cache: 'no-store' });
    if (!response.ok) { const result = await response.json().catch(() => ({})); throw Error(result.error || 'Account service is unavailable. Please try again shortly.'); }
    return response.json();
  }
  async function post(endpoint, data = {}) {
    const current = await session();
    const response = await fetch(endpoint, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': current.csrfToken },
      body: JSON.stringify(data),
    });
    const result = await response.json();
    if (!response.ok) throw Error(result.error || 'Please try again.');
    return result;
  }
  for (const [id, endpoint] of [['signup-form', '/api/auth/signup'], ['login-form', '/api/auth/login']]) {
    const form = document.getElementById(id);
    if (!form) continue;
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const button = form.querySelector('[type="submit"]');
      if (button.disabled) return;
      button.disabled = true;
      show(id === 'signup-form' ? 'Creating your account…' : 'Signing in…', true);
      try {
        await post(endpoint, Object.fromEntries(new FormData(form)));
        form.querySelector('[type="password"]').value = '';
        const next = new URLSearchParams(location.search).get('next');
        location.assign(next && /^(?:stage-[1-7]|instructions(?:-stage-[2-7])?)\.html$/.test(next) ? next : 'home.html');
      } catch (error) { show(error.message); }
      finally { button.disabled = false; }
    });
  }
  // Providers intentionally fail clearly until their real OAuth setup is added.
  // These buttons never simulate an Apple/Google account or save a fake session.
  document.querySelectorAll('[data-provider]').forEach(button => {
    button.addEventListener('click', async () => {
      button.disabled = true;
      try { await post(`/api/auth/${button.dataset.provider}`); }
      catch (error) { show(error.message); }
      finally { button.disabled = false; }
    });
  });
  document.querySelectorAll('[data-logout]').forEach(button => {
    button.addEventListener('click', async () => {
      button.disabled = true;
      try { await post('/api/auth/logout'); location.assign('index.html'); }
      catch (error) { show(error.message); button.disabled = false; }
    });
  });
  // Public lessons stay accessible. If a session exists, use the account name
  // instead of the design's sample name. Render only text, never user HTML.
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    session().then(({ user }) => {
      if (!user) return;
      const greeting = document.querySelector('.greeting strong');
      const learner = document.querySelector('.learner-details h1');
      if (greeting) greeting.textContent = user.name;
      if (learner) learner.textContent = user.name;
    }).catch(() => {});
  }
})();
    </script>
