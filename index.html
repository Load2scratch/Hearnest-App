    <!-- Restore display preference before the page paints. -->
    <!-- Internal script: theme.js -->
    <script data-source="theme.js">
      "use strict";
      // Run in <head> before styles: restore the saved theme before the first paint.
      // This stores only a display preference, never account information.
      (() => {
        const key = "hearnest.theme";
        let current = "light";
        function savedTheme() {
          try {
            const stored = localStorage.getItem(key);
            if (stored === "dark" || stored === "light") return stored;
          } catch {}
          try {
            const cookie = document.cookie
              .split("; ")
              .find((item) => item.startsWith("hearnest_theme="));
            return cookie?.split("=")[1] === "dark" ? "dark" : "light";
          } catch {
            return "light";
          }
        }
        function apply(theme, persist = false) {
          if (theme !== "dark" && theme !== "light") return;
          current = theme;
          document.documentElement.dataset.theme = theme;
          const checkbox = document.getElementById("dark-mode");
          if (checkbox) checkbox.checked = theme === "dark";
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            if (!meta.dataset.lightThemeColor)
              meta.dataset.lightThemeColor = meta.content;
            meta.content =
              theme === "dark" ? "#242620" : meta.dataset.lightThemeColor;
          }
          if (persist) {
            try {
              localStorage.setItem(key, theme);
            } catch {}
            // Cookie fallback preserves the preference when localStorage is restricted.
            try {
              if (
                location.protocol === "http:" ||
                location.protocol === "https:"
              )
                document.cookie = `hearnest_theme=${theme}; Path=/; SameSite=Lax; Max-Age=31536000${location.protocol === "https:" ? "; Secure" : ""}`;
            } catch {}
          }
        }
        apply(savedTheme());
        document.addEventListener("DOMContentLoaded", () => {
          apply(savedTheme());
          document
            .getElementById("dark-mode")
            ?.addEventListener("change", (event) =>
              apply(event.target.checked ? "dark" : "light", true),
            );
        });
        // Keep other tabs and browser Back/Forward restorations in sync.
        window.addEventListener("storage", (event) => {
          if (event.key === key)
            apply(event.newValue === "dark" ? "dark" : "light");
        });
        window.addEventListener("pageshow", () => apply(savedTheme()));
        window.HearnestTheme = {
          set: (theme) => apply(theme, true),
          get: () => current,
        };
      })();
    </script>
